<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Proyecto Videojuegos</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="g-body">

  <main class="g-tarjeta">
    <p class="g-logo">🎮 <span>Proyecto Videojuegos</span></p>
    <h1 id="titulo">Iniciar sesión</h1>
    <p class="g-subtitulo" id="subtitulo">Ir a Proyecto Videojuegos</p>

    <form id="formLogin" novalidate>

      <div id="paso1">
        <div class="g-campo" id="campo-identificador">
          <input type="text" id="identificador" placeholder=" " autocomplete="username" autofocus>
          <label for="identificador">Correo electrónico o usuario</label>
        </div>
        <p class="g-error-campo" id="error-identificador"></p>
      </div>

      <div id="paso2" hidden>
        <button type="button" class="g-chip" id="btnAtras" title="Usar otra cuenta">
          <span class="avatar" id="avatar"></span>
          <span class="texto" id="chipTexto"></span>
        </button>

        <div class="g-campo" id="campo-contrasena">
          <input type="password" id="contrasena" placeholder=" " autocomplete="current-password">
          <label for="contrasena">Contraseña</label>
        </div>
        <p class="g-error-campo" id="error-contrasena"></p>

        <label class="g-mostrar">
          <input type="checkbox" id="mostrar">
          Mostrar contraseña
        </label>
      </div>

      <p class="g-error-general" id="errorGeneral" role="alert"></p>

      <div class="g-acciones">
        <a href="registro.html" class="g-enlace">Crear cuenta</a>
        <button type="submit" class="g-boton" id="btnSiguiente">Siguiente</button>
      </div>
    </form>
  </main>

  <p class="g-pie">&copy; 2026 Proyecto Videojuegos</p>

  <script src="js/login.js"></script>
</body>
</html>

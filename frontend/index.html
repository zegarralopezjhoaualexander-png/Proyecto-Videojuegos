<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Videojuegos</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="cabecera">
    <a href="#inicio" class="logo">🎮 <span>Tienda de Videojuegos</span></a>
    <nav>
      <a href="#catalogo">Catálogo</a>
      <a href="admin.html" id="enlaceAdmin" hidden>Panel admin</a>
      <a href="login.html" id="enlaceLogin" hidden>Iniciar sesión</a>
      <span id="usuarioActual" hidden></span>
      <button type="button" id="btnSalir" class="cancelar" hidden>Cerrar sesión</button>
      <button type="button" id="btnCarrito" class="boton-carrito" aria-label="Abrir carrito">
        🛒 Carrito <span id="contadorCarrito">0</span>
      </button>
    </nav>
  </header>

  <main>
    <section class="portada" id="inicio">
      <h2>Los mejores <span class="resalte">videojuegos</span> en un solo lugar</h2>
      <p>Explora el catálogo por categoría, plataforma y precio.</p>

      <div class="estadisticas">
        <div class="estadistica">
          <strong id="statJuegos">0</strong>
          <span>Juegos</span>
        </div>
        <div class="estadistica">
          <strong id="statCategorias">0</strong>
          <span>Categorías</span>
        </div>
        <div class="estadistica">
          <strong id="statPlataformas">0</strong>
          <span>Plataformas</span>
        </div>
      </div>
    </section>

    <section id="catalogo" class="seccion">
      <h2 class="titulo-seccion">Catálogo</h2>

      <div class="filtros">
        <input type="search" id="buscador" placeholder="🔍 Buscar por nombre, categoría o plataforma" aria-label="Buscar">
        <select id="filtroCategoria" aria-label="Filtrar por categoría">
          <option value="">Todas las categorías</option>
        </select>
        <select id="filtroPlataforma" aria-label="Filtrar por plataforma">
          <option value="">Todas las plataformas</option>
        </select>
        <select id="ordenar" aria-label="Ordenar por">
          <option value="">Ordenar: destacados</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
          <option value="nombre">Nombre (A-Z)</option>
          <option value="puntuacion-desc">Mejor puntuados</option>
          <option value="anio-desc">Más nuevos</option>
          <option value="reciente">Agregados recientemente</option>
        </select>
        <label class="casilla-favoritos">
          <input type="checkbox" id="soloStock">
          Solo disponibles
        </label>
        <button type="button" id="btnLimpiar" class="cancelar">Limpiar</button>
      </div>
      <p id="contador"></p>

      <div class="tarjetas" id="listaJuegos"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Tienda de Videojuegos</p>
  </footer>

  <div id="fondoCarrito" class="fondo-carrito" hidden></div>
  <aside id="panelCarrito" class="panel-carrito" aria-label="Carrito de compras" hidden>
    <div class="carrito-cabecera">
      <h2>🛒 Tu carrito</h2>
      <button type="button" id="btnCerrarCarrito" class="cancelar" aria-label="Cerrar carrito">✕</button>
    </div>

    <div id="itemsCarrito" class="carrito-items"></div>

    <div class="carrito-pie">
      <div class="carrito-total">
        <span>Total</span>
        <strong id="totalCarrito">$0.00</strong>
      </div>
      <button type="button" id="btnFinalizar" class="primario">Finalizar compra</button>
      <button type="button" id="btnVaciar" class="cancelar">Vaciar carrito</button>
      <p id="avisoCarrito" role="status"></p>
    </div>
  </aside>

  <script src="js/tienda.js"></script>
</body>
</html>

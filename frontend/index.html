<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Videojuegos</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="cabecera">
    <a href="#inicio" class="logo">🎮 <span>Proyecto Videojuegos</span></a>
    <nav>
      <a href="#agregar">Agregar</a>
      <a href="#juegos">Juegos</a>
      <span id="usuarioActual"></span>
      <button type="button" id="btnSalir" class="cancelar">Cerrar sesión</button>
    </nav>
  </header>

  <main>
    <section class="portada" id="inicio">
      <h2>Tu colección de <span class="resalte">videojuegos</span></h2>
      <p>Agrega, busca y organiza todos tus juegos en un solo lugar.</p>

      <div class="estadisticas">
        <div class="estadistica">
          <strong id="statTotal">0</strong>
          <span>Juegos</span>
        </div>
        <div class="estadistica">
          <strong id="statGeneros">0</strong>
          <span>Géneros</span>
        </div>
        <div class="estadistica">
          <strong id="statPromedio">—</strong>
          <span>Puntuación media</span>
        </div>
      </div>
    </section>

    <section id="agregar" class="seccion">
      <div class="panel" id="panelFormulario">
        <h2 id="tituloForm">Agregar videojuego</h2>
        <form id="formJuego">
          <input type="text" id="nombre" placeholder="Nombre del juego" aria-label="Nombre del juego" required>
          <input type="text" id="genero" placeholder="Género" aria-label="Género" required>
          <input type="text" id="plataforma" placeholder="Plataforma (opcional)" aria-label="Plataforma">
          <input type="number" id="anio" placeholder="Año (opcional)" aria-label="Año" min="1950" max="2100">
          <input type="number" id="puntuacion" placeholder="Puntuación 1-10 (opcional)" aria-label="Puntuación" min="1" max="10">
          <input type="text" id="imagen" class="campo-ancho" placeholder="Imagen (opcional): enlace https://... o img/archivo.jpg" aria-label="Imagen">
          <div class="botones-form">
            <button type="submit" id="btnGuardar" class="primario">Agregar</button>
            <button type="button" id="btnCancelar" class="cancelar" hidden>Cancelar</button>
          </div>
        </form>
        <p id="mensaje"></p>
      </div>
    </section>

    <section id="juegos" class="seccion">
      <h2 class="titulo-seccion">Mis videojuegos</h2>

      <div class="filtros">
        <input type="search" id="buscador" placeholder="🔍 Buscar por nombre o plataforma" aria-label="Buscar">
        <select id="filtroGenero" aria-label="Filtrar por género">
          <option value="">Todos los géneros</option>
        </select>
        <select id="ordenar" aria-label="Ordenar por">
          <option value="">Ordenar: orden de agregado</option>
          <option value="reciente">Más recientes primero</option>
          <option value="nombre">Nombre (A-Z)</option>
          <option value="puntuacion-desc">Mayor puntuación</option>
          <option value="puntuacion-asc">Menor puntuación</option>
          <option value="anio-desc">Año: más nuevos</option>
          <option value="anio-asc">Año: más antiguos</option>
        </select>
        <label class="casilla-favoritos">
          <input type="checkbox" id="soloFavoritos">
          ⭐ Solo favoritos
        </label>
        <button type="button" id="btnLimpiar" class="cancelar">Limpiar</button>
      </div>
      <p id="contador"></p>

      <div class="tarjetas" id="listaJuegos"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Proyecto Videojuegos</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
